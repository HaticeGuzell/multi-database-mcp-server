name: multi-database-mcp-server

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
      MYSQL_DATABASE: northwind
      MYSQL_USER: mcp_reader
      MYSQL_PASSWORD: ${MYSQL_READER_PASSWORD:?Set MYSQL_READER_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: northwind
      POSTGRES_USER: db_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env.docker}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?Set POSTGRES_READER_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mcp-mysql:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: Dockerfile
    image: multi-database-mcp-server:local
    environment:
      DB_TYPE: mysql
      DB_URL: mysql://mcp_reader:${MYSQL_READER_PASSWORD:?Set MYSQL_READER_PASSWORD in .env.docker}@mysql:3306/northwind
    depends_on:
      mysql:
        condition: service_healthy
    stdin_open: true

  mcp-postgres:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: Dockerfile
    image: multi-database-mcp-server:local
    environment:
      DB_TYPE: postgres
      DB_URL: postgresql://mcp_reader_pg:${POSTGRES_READER_PASSWORD:?Set POSTGRES_READER_PASSWORD in .env.docker}@postgres:5432/northwind
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true

volumes:
  mysql_data:
  postgres_data:
