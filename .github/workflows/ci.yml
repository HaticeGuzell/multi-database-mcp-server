name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, SQL security and fixture integrity
        run: npm test
      - name: Build
        run: npm run build
